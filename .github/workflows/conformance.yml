name: Conformance

# Every README PASS claim in this repository is enforced here:
# both reference verifiers run against the byte-pinned fixture set,
# the fixture generator must reproduce the committed bytes exactly,
# the cross-implementation parity gate must report agreement, and the
# machine-readable conformance profile must match the fixtures.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  conformance:
    name: verifiers + parity + byte-pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: |
            verifiers/go/go.sum
            scripts/generate-fixtures/go.sum

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python verifier dependency
        run: python3 -m pip install "cryptography>=42.0.0"

      - name: Go verifier over fixtures
        working-directory: verifiers/go
        run: go run . ../../fixtures

      - name: Python verifier over fixtures
        working-directory: verifiers/python
        run: python3 verify.py ../../fixtures

      - name: Schema validation (fixtures vs vendored spec schemas)
        run: |
          python3 -m pip install "jsonschema>=4.21"
          python3 scripts/schema_validation.py

      - name: Vendored schema drift gate (pinned agent-trust-protocol ref)
        uses: actions/checkout@v4
        with:
          repository: opena2a-standards/agent-trust-protocol
          ref: ed7fc22c4ce212498559fb54bcedc5fb31f89af6
          path: .spec-src

      - name: Vendored schema drift gate (compare)
        run: |
          for f in trust-proof-v1 signed-tree-head-v1 discovery-v1 inclusion-proof-v1 consistency-proof-v1 revocation-list-v1; do
            diff ".spec-src/schemas/$f.schema.json" \
                 "schemas/vendor/agent-trust-protocol/$f.schema.json"
          done
          rm -rf .spec-src

      - name: Fixture byte-pin (generator determinism)
        working-directory: scripts/generate-fixtures
        run: |
          go run .
          cd ../..
          git diff --exit-code -- fixtures MANIFEST.sha256

      - name: MANIFEST.sha256 integrity
        run: |
          rc=0
          while read -r sha file; do
            [ -z "$sha" ] && continue
            got=$(sha256sum "$file" | awk '{print $1}')
            if [ "$got" != "$sha" ]; then
              echo "MANIFEST mismatch: $file"; rc=1
            fi
          done < MANIFEST.sha256
          exit $rc

      - name: Cross-implementation parity gate
        run: python3 scripts/parity/parity.py --json parity-report.json

      - name: Conformance profile is current
        run: python3 scripts/conformance_profile.py --check

      - name: README counts match the fixture set
        run: python3 scripts/check_readme_counts.py

      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-report
          path: parity-report.json
          if-no-files-found: ignore

  sign-manifest:
    name: cosign MANIFEST (keyless, main only)
    runs-on: ubuntu-latest
    needs: conformance
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: sigstore/cosign-installer@v3

      - name: Keyless sign MANIFEST.sha256 (Rekor is the durable record)
        run: cosign sign-blob --yes --bundle MANIFEST.sha256.cosign.bundle MANIFEST.sha256

      - name: Self-verify the signature just produced
        run: |
          cosign verify-blob \
            --bundle MANIFEST.sha256.cosign.bundle \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/conformance.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            MANIFEST.sha256

      - name: Upload signature bundle
        uses: actions/upload-artifact@v4
        with:
          name: manifest-cosign-bundle
          path: MANIFEST.sha256.cosign.bundle
